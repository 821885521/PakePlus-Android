<html lang="zh-cn" data-trae-theme="light"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>智能车辆控制 · 编程画线</title>
    <style>
        /* 强制黑色主题 */
        :root { 
            color-scheme: dark;
            --bg: #0b0d12; --panel: #14161c; --dial: #101218; 
            --text-main: #e0f7fa; --text-sub: #80cbc4; --needle: #00e5ff; 
            --danger: #ff1744; --gear-glow: #4ade80; --accent: #00e5ff; --ws-green: #00e676;
            --warn: #ffab00;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg) !important; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; touch-action: none; overflow: hidden; }
        
        .top-section { flex-shrink: 0; background: var(--panel); padding: 10px 15px; border-bottom: 1px solid #222; border-radius: 0 0 15px 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 10; display: flex; flex-direction: column; gap: 8px;}

        .top-btn-group { 
            display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
        }
        .top-btn-group::-webkit-scrollbar { display: none; }

        .t-btn { 
            flex: 0 0 auto; min-width: 58px; padding: 10px 8px; font-size: 12px; font-weight: bold; 
            background: linear-gradient(to bottom, #333, #1a1a1a); color: #aaa; border: 1px solid #444; 
            border-radius: 8px; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); cursor: pointer; transition: 0.1s; white-space: nowrap;
        }
        .t-btn:active { box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); background: #111; transform: scale(0.98);}
        .t-btn.on { color: var(--accent); border-color: var(--accent); text-shadow: 0 0 10px var(--accent); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .t-btn.danger { color: var(--danger); border-color: #441111; }
        .t-btn.danger.on { color: #fff; background: #661111; border-color: var(--danger); text-shadow: 0 0 10px var(--danger); }

        .top-status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #888; font-family: monospace; padding: 0 5px;}
        .status-group { display: flex; gap: 10px; align-items: center;}
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: 0.3s; }
        .status-dot.ws-connected { background: var(--ws-green); box-shadow: 0 0 8px var(--ws-green); }
        .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .val-text { color: var(--text-main); font-weight: bold; }

        /* 多车选择与编队 */
        .car-selector { background: #111; color: #00e5ff; border: 1px solid #333; border-radius: 4px; padding: 2px 4px; font-size: 11px; outline: none; font-family: monospace; max-width: 130px; }
        .btn-mini { padding: 3px 6px; font-size: 10px; font-weight: bold; background: #222; border: 1px solid #444; border-radius: 4px; color: #aaa; cursor: pointer; transition: 0.2s;}
        .btn-mini.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(0,229,255,0.4); }

        /* 3D 姿态仪组件 */
        .attitude-wrapper { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 2px 8px 2px 2px; border-radius: 20px; border: 1px solid #333; }
        .attitude-indicator { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; position: relative; background: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); border: 1px solid #555; }
        .attitude-horizon { position: absolute; width: 300%; height: 300%; top: -100%; left: -100%; background: linear-gradient(to bottom, #103d63 50%, #4a2c1a 50%); transition: transform 0.1s linear; transform-origin: 50% 50%; }
        .attitude-line { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.8); transform: translateY(-50%); box-shadow: 0 0 4px #fff; }
        .attitude-plane { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; z-index: 2; }
        .attitude-plane::before, .attitude-plane::after { content: ''; position: absolute; background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
        .attitude-plane::before { width: 20px; height: 2px; top: 10px; left: 0; }
        .attitude-plane::after { width: 4px; height: 4px; border-radius: 50%; top: 9px; left: 8px; background: #fff; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; gap: 10px; min-height: 0; }
        .dashboard { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
        .gauge-wrapper { position: relative; width: 100%; max-width: min(300px, 65vh); aspect-ratio: 1; background: radial-gradient(circle, #1a2230 0%, #10141d 68%, #07090d 100%); border-radius: 50%; box-shadow: inset 0 10px 30px rgba(0,0,0,0.9), 0 10px 25px rgba(0,0,0,0.7), 0 0 30px rgba(0,229,255,0.05); border: 4px solid #0c0e13; transition: box-shadow 0.3s, border-color 0.3s; }
        .gauge-wrapper.overload { box-shadow: inset 0 0 30px rgba(255,23,68,0.25), 0 0 30px rgba(255,23,68,0.4); border-color: rgba(255,23,68,0.4); }
        .gauge-svg { width: 100%; height: 100%; display: block; }
        
        .speed-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; margin-top: 25px; pointer-events: none; }
        .speed-val { font-size: 40px; font-weight: 900; font-family: 'Courier New', monospace; color: var(--text-main); line-height: 1; transition: color 0.2s; text-shadow: 0 0 15px rgba(224,247,250,0.25); }
        .speed-unit { font-size: 12px; color: var(--text-sub); font-weight: bold; margin-top: 2px; letter-spacing: 1px; }

        .steer-indicator { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: 64%; height: 12px; background: #111; border-radius: 6px; border: 1px solid #2a2f3a; overflow: visible; pointer-events: none; box-shadow: inset 0 2px 6px #000; }
        .steer-indicator .steer-track { height: 100%; width: 100%; background: repeating-linear-gradient(90deg, transparent, transparent 10%, rgba(255,255,255,0.06) 10%, rgba(255,255,255,0.06) 12%); border-radius: 6px; opacity: 0.8; }
        .steer-indicator .steer-center-line { position: absolute; top: -4px; bottom: -4px; left: 50%; width: 2px; background: rgba(255,255,255,0.4); transform: translateX(-50%); }
        .steer-indicator .steer-ball { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; background: radial-gradient(circle, #fff, #00e5ff); border-radius: 50%; box-shadow: 0 0 15px #00e5ff, 0 0 5px #fff; transition: left 0.05s linear, background 0.2s, box-shadow 0.2s; border: 2px solid #fff; z-index: 2; }

        .control-area { flex-shrink: 0; width: 100%; display: flex; justify-content: space-between; align-items: stretch; padding: 10px 10px; background: var(--panel); border-top: 1px solid #222; border-radius: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); gap: 8px; height: 250px; }
        .left-controls { flex: 0 0 auto; display: flex; align-items: stretch; }
        .right-controls { flex: 1; min-width: 0; display: flex; align-items: stretch; }
        .steer-group { display: flex; flex-direction: column; justify-content: center; gap: 12px; height: 100%; flex-shrink: 0;}
        .steer-btn { flex: 1; width: 56px; background: linear-gradient(180deg, #606060 0%, #1a1a1a 100%); border: 2px solid #4a4a4a; border-radius: 16px; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 12px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.08s, box-shadow 0.08s, border-color 0.15s; }
        .steer-btn.active { transform: scale(0.95) translateY(2px); background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%); border-color: var(--gear-glow); box-shadow: 0 0 18px rgba(74,222,128,0.45), inset 0 3px 8px rgba(0,0,0,0.8); }
        .steer-btn.disabled { opacity: 0.35; pointer-events: none; }
        .arrow-left { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-right: 18px solid #fff; filter: drop-shadow(0 0 4px rgba(255,255,255,0.6)); margin-right: 6px; }
        .arrow-right { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 18px solid #fff; filter: drop-shadow(0 0 4px rgba(255,255,255,0.6)); margin-left: 6px; }

        .gear-container { position: relative; width: 68px; height: 100%; background: #050505; border-radius: 20px; border: 2px solid #333; box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.5); display: flex; justify-content: center; touch-action: none; flex-shrink: 0; }
        .gear-track { position: absolute; top: 20px; bottom: 20px; width: 28px; background: linear-gradient(180deg, #111, #000, #111); border-radius: 15px; border: 1px solid #222; box-shadow: inset 0 0 15px rgba(0,0,0,1), 0 0 5px rgba(255,255,255,0.05); }
        .gear-base { position: absolute; bottom: 10px; width: 60px; height: 80px; background: radial-gradient(ellipse at bottom, rgba(74, 222, 128, 0.4) 0%, transparent 70%); border-radius: 20px; pointer-events: none; z-index: 1; }
        .gear-knob { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 44px; height: 70px; background: linear-gradient(180deg, #2a2a2a 0%, #0a0a0a 100%); border-radius: 12px; border: 2px solid #555; box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; z-index: 10; cursor: grab; transition: border-color 0.2s, box-shadow 0.2s; }
        .gear-knob:active { cursor: grabbing; }
        .gear-knob::before { content: ''; position: absolute; inset: -2px; border-radius: 12px; pointer-events: none; border: 2px solid transparent; border-top-color: var(--gear-glow); border-left-color: var(--gear-glow); border-right-color: var(--gear-glow); opacity: 0.8; box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); transition: 0.3s; }
        .gear-screen { width: 30px; height: 30px; margin-top: 6px; background: #000; border-radius: 6px; border: 1px solid #333; box-shadow: inset 0 2px 5px rgba(0,0,0,1); display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 900; font-family: 'Courier New', monospace; color: #fff; text-shadow: 0 0 10px #fff; transition: 0.2s; }
        .gear-dot { width: 5px; height: 5px; border-radius: 50%; background: #222; margin-top: 6px; box-shadow: inset 0 1px 2px rgba(0,0,0,1); }
        .gear-dot.active { background: var(--gear-glow); box-shadow: 0 0 8px var(--gear-glow); }

        .pedal-group { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: stretch; justify-content: flex-end; }
        .speed-levels { display: flex; gap: 6px; width: 100%; }
        .speed-levels .t-btn { flex: 1; min-width: 0; padding: 8px 2px; font-size: 12px; }
        .throttle-meta { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 2px; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.5px; color: var(--text-sub); }
        .throttle-meta b { color: var(--accent); font-size: 12px; text-shadow: 0 0 8px rgba(0,229,255,0.55); }
        .pedal { flex: 1; width: 100%; background: linear-gradient(160deg, #3c3c3c 0%, #1a1a1a 50%, #0d0d0d 100%); border: 3px solid #4a4a4a; border-radius: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.15), inset 0 -2px 4px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.08s, box-shadow 0.08s, border-color 0.15s; position: relative; transform-origin: bottom center; display: flex; justify-content: center; align-items: center; overflow: hidden; touch-action: none; min-height: 56px; }
        .pedal::before { content: ''; position: absolute; inset: 12px; background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(0,0,0,0.5) 6px 8px); border-radius: 8px; opacity: 0.55; }
        .pedal::after { content: ''; position: absolute; top: 6px; left: 10%; width: 80%; height: 6px; background: linear-gradient(to bottom, rgba(255,255,255,0.18), transparent); border-radius: 3px; }
        .pedal.active { transform: perspective(300px) rotateX(18deg) scaleY(0.94); box-shadow: 0 2px 6px rgba(0,0,0,0.8), inset 0 4px 12px rgba(0,0,0,0.9); }
        .pedal.gas.active { border-color: var(--gear-glow); box-shadow: 0 0 20px rgba(74,222,128,0.45), inset 0 4px 12px rgba(0,0,0,0.9); }
        .gas-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, rgba(74,222,128,0.55) 0%, rgba(0,229,255,0.10) 70%, transparent 100%); transition: height 0.08s linear; pointer-events: none; z-index: 1; }
        .gas-text { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #cfd8dc; font-size: 14px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 8px rgba(0,0,0,0.9); pointer-events: none; }
        .gas-text .gas-sub { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #8a9aa0; }
        .pedal.gas.active .gas-text { color: #eaffea; }

        body.handbrake-on::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999; border: 4px solid var(--danger); box-shadow: inset 0 0 30px rgba(255,23,68,0.5); animation: hbPulse 0.8s infinite alternate; }
        @keyframes hbPulse { from { opacity: 0.25; box-shadow: inset 0 0 15px rgba(255,23,68,0.3); } to { opacity: 1; box-shadow: inset 0 0 40px rgba(255,23,68,0.7); } }

        body.failsafe::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 998; border: 4px solid var(--warn); box-shadow: inset 0 0 40px rgba(255,171,0,0.4); animation: fsPulse 0.6s infinite alternate; }
        body.failsafe::before { content: '信号丢失 · 失控保护'; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--warn); font-size: 18px; font-weight: 900; font-family: monospace; text-shadow: 0 0 20px rgba(255,171,0,0.9); pointer-events: none; z-index: 1000; animation: fsPulse 0.6s infinite alternate; white-space: nowrap; }
        @keyframes fsPulse { from { opacity: 0.4; } to { opacity: 1; } }

        /* ========== 全屏层通用 ========== */
        .path-layer { position: fixed; inset: 0; z-index: 2000; background: rgba(2, 6, 10, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; padding: 12px 14px 18px; gap: 10px; opacity: 0; pointer-events: none; transform: translateY(20px); transition: opacity 0.25s ease, transform 0.25s ease; }
        .path-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .path-layer::before { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px); background-size: 36px 36px; }
        .path-header { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px 4px 2px; position: relative; z-index: 2; }
        .path-title { font-size: 16px; font-weight: 900; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 12px rgba(0,229,255,0.7), 0 0 24px rgba(0,229,255,0.3); }
        .path-hint { font-size: 11px; color: var(--text-sub); font-family: 'Courier New', monospace; letter-spacing: 0.5px; }
        .path-canvas { flex: 1; width: 100%; min-height: 0; border-radius: 16px; background: rgba(4, 8, 14, 0.6); border: 1px solid rgba(0,229,255,0.25); box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,229,255,0.08); touch-action: none; cursor: crosshair; position: relative; z-index: 2; }
        .path-footer { flex-shrink: 0; display: flex; gap: 10px; position: relative; z-index: 2; }
        .path-footer .t-btn { flex: 1; min-width: 0; }
        #btnPathExec:disabled { opacity: 0.35; pointer-events: none; }

        /* ========== 表演面板专属网格 ========== */
        .perform-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 5px; position: relative; z-index: 2; align-content: center; }
        .perform-grid .t-btn { font-size: 15px; padding: 15px 5px; height: auto; border-radius: 12px; box-shadow: inset 0 0 20px rgba(0,229,255,0.05); border-color: rgba(0,229,255,0.3); display: flex; justify-content: center; align-items: center; transition: 0.2s; white-space: normal; }
        .perform-grid .t-btn:active, .perform-grid .t-btn.active-perform { background: rgba(0,229,255,0.2); box-shadow: inset 0 0 30px rgba(0,229,255,0.6); transform: scale(0.98); border-color: var(--accent); color: #fff; }
        .perform-status { flex-shrink: 0; margin: 2px 6px 0; padding: 7px 10px; border-radius: 9px; background: rgba(0,0,0,0.45); border: 1px solid #263041; font: 12px/1.5 'Courier New', monospace; color: var(--text-sub); text-align: center; letter-spacing: 0.4px; position: relative; z-index: 2; }
        .perform-status b { color: var(--accent); }
        .perform-status .st-rev { color: var(--warn); font-weight: bold; }
        .perform-status .st-fwd { color: #4ade80; font-weight: bold; }
        .perform-status .st-turn { color: #b388ff; font-weight: bold; }
        .perform-status .st-pause { color: #9aa0a6; }
        .perform-status .st-warn { color: var(--danger); }

        /* ========== 倒车测试面板（现场诊断，仍走统一倒车时序） ========== */
        .rev-test { flex-shrink: 0; margin: 2px 6px 0; border-radius: 9px; background: rgba(0,0,0,0.4); border: 1px solid #263041; position: relative; z-index: 2; }
        .rev-test-head { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
        .rev-test-tip { flex: 1; font: 11px/1.4 'Courier New', monospace; color: var(--text-sub); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rev-test-body { display: none; padding: 0 8px 8px; }
        .rev-test.show .rev-test-body { display: block; }
        .rev-test-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .rev-test-row .rev-btn { flex: 1 1 0; min-width: 50px; font-size: 13px; padding: 7px 4px; line-height: 1.15; }
        .rev-test-row .rev-btn small { display: block; font-size: 9px; color: var(--warn); }
        .rev-test-row .rev-btn.holding { border-color: var(--warn); color: var(--warn); box-shadow: 0 0 12px rgba(255,171,0,0.35); }
        .rev-test-row .rev-btn.auto { color: var(--accent); border-color: rgba(0,229,255,0.4); }
        /* 前进/后退两排 + 标定行 */
        .rev-line { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
        .rev-tag { flex: 0 0 34px; text-align: center; font: bold 11px/1 'Courier New', monospace; border-radius: 5px; padding: 5px 0; }
        .rev-tag.fwd { color: #4ade80; border: 1px solid rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
        .rev-tag.rev { color: var(--warn); border: 1px solid rgba(255,171,0,0.35); background: rgba(255,171,0,0.08); }
        .rev-line .rev-test-row { flex: 1; min-width: 0; flex-wrap: nowrap; gap: 4px; }
        .rev-line .rev-btn { min-width: 0; flex: 1 1 0; font-size: 12px; padding: 6px 2px; }
        .rev-line .rev-btn small { font-size: 8px; }
        .rev-tools { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .rev-tools .rev-btn { flex: 0 0 auto; min-width: 58px; font-size: 12px; padding: 6px 8px; }
        .cal-wrap { flex: 1; display: flex; align-items: center; gap: 4px; font: 10px/1.2 'Courier New', monospace; color: var(--text-sub); white-space: nowrap; }
        .cal-wrap input { width: 46px; background: #0b0d12; border: 1px solid #34404f; border-radius: 4px; color: var(--accent); font: 11px monospace; padding: 3px 3px; text-align: center; }

        /* ========== 黑匣子面板 ========== */
        .telemetry-panel { position: fixed; top: 15%; bottom: 15%; left: 5%; right: 5%; z-index: 2500; background: rgba(10, 15, 20, 0.95); border: 1px solid var(--accent); border-radius: 16px; box-shadow: 0 0 40px rgba(0,229,255,0.2); display: flex; flex-direction: column; padding: 15px; gap: 10px; opacity: 0; pointer-events: none; transform: scale(0.95); transition: 0.3s; }
        .telemetry-panel.show { opacity: 1; pointer-events: auto; transform: scale(1); }
        .telemetry-canvas { flex: 1; background: #050505; border: 1px solid #333; border-radius: 8px; width: 100%; height: 100%; }
        .telemetry-legend { display: flex; gap: 15px; font-size: 12px; font-family: monospace; justify-content: center; }
        .telemetry-legend span { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 4px; border-radius: 2px; }

        /* ========== 车辆管理弹窗 ========== */
        .manage-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); z-index: 3000; background: #14161c; border: 1px solid var(--accent); border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.2s; }
        .manage-panel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .manage-title { color: var(--accent); font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .manage-list { display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; margin-bottom: 15px; }
        .manage-item { display: flex; gap: 8px; align-items: center; }
        .manage-item input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 13px; outline: none; }

.trae-shortcut-key { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; line-height: 12px; color: var(--trae-icon-secondary); }
.trae-add-to-chat-divider { width: 2px; height: 12px; padding: 0px 6px; box-sizing: content-box; background-clip: content-box; background-color: var(--trae-border-l2); flex-shrink: 0; }
.trae-editor-view { display: flex; flex-direction: column; width: 320px; padding: 8px; background: transparent; }
.trae-editor-text-container { display: flex; align-items: center; padding: 8px; background: var(--trae-bg-overlay-l1); border: 1px solid var(--trae-border-l3); border-radius: 4px; gap: 8px; }
.trae-editor-textarea { flex: 1 1 0%; padding: 0px 2px; border: none; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 20px; color: var(--trae-text-default); resize: none; outline: none; overflow-y: auto; max-height: 140px; }
.trae-editor-textarea::placeholder { color: var(--trae-text-tertiary); }
.trae-editor-action-bar { display: flex; align-items: center; justify-content: flex-end; gap: 4px; max-height: 0px; opacity: 0; overflow: hidden; transition: max-height 0.2s ease-out, opacity 0.2s ease-out, margin-top 0.2s ease-out; }
.trae-editor-action-bar-visible { max-height: 32px; opacity: 1; margin-top: 8px; }
.trae-editor-cancel-button { display: flex; align-items: center; justify-content: center; height: 24px; padding: 0px 4px; background: var(--trae-bg-overlay-l2); border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.15s; }
.trae-editor-cancel-button:hover { background: var(--trae-bg-overlay-l3); }
.trae-editor-cancel-button:active { background: var(--trae-bg-overlay-l3); }
.trae-editor-cancel-button:focus-visible { outline: 2px solid var(--trae-status-primary); outline-offset: 1px; }
.trae-editor-cancel-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; line-height: 16px; color: var(--trae-text-default); white-space: nowrap; padding: 0px 4px; }
.trae-editor-submit-button { display: flex; align-items: center; justify-content: center; height: 24px; padding: 0px 8px; background: var(--trae-bg-invert); border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.15s; }
.trae-editor-submit-button:hover { background: var(--trae-bg-invert-hover); }
.trae-editor-submit-button:active { background: var(--trae-bg-invert-active); }
.trae-editor-submit-button:focus-visible { outline: 2px solid var(--trae-status-primary); outline-offset: 1px; }
.trae-editor-submit-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; line-height: 16px; color: var(--trae-text-onaccent); white-space: nowrap; padding: 0px 4px; }
.trae-editor-submit-icon { display: flex; align-items: center; justify-content: center; width: 12px; height: 12px; color: var(--trae-icon-onaccent); flex-shrink: 0; }
.trae-success-view { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0px 12px; height: 32px; white-space: nowrap; }
.trae-success-icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; color: var(--trae-status-success); flex-shrink: 0; }
.trae-success-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; line-height: 18px; color: var(--trae-text-default); user-select: none; }</style></head>

                <div class="speed-num">
                    <div class="speed-val" id="valSpeed" style="color: var(--text-main);">0</div>
                    <div class="speed-unit">公里/小时</div>
                </div>
                <div class="steer-indicator" id="steerIndicator">
                    <div class="steer-track"></div>
                    <div class="steer-center-line"></div>
                    <span style="position:absolute; left:6px; top:50%; transform:translateY(-50%); font-size:10px; color:#666; font-weight:bold; pointer-events:none;">L</span>
                    <span style="position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:10px; color:#666; font-weight:bold; pointer-events:none;">R</span>
                    <div class="steer-ball" id="steerBall" style="left: 50%; background: radial-gradient(circle, rgb(255, 255, 255), rgb(0, 229, 255)); box-shadow: rgb(0, 229, 255) 0px 0px 15px, rgb(255, 255, 255) 0px 0px 5px;"></div>

        <div class="control-area">

                </div>
            </div>

                <div class="gear-base"></div>
                <div class="gear-track"></div>
                <div class="gear-knob" id="gearKnob" style="top: 40%;">
                    <div class="gear-screen" id="gearScreen">N</div>
                    <div class="gear-dot active" id="gearDot"></div>
                </div>
            </div>
            <div class="right-controls">
                <div class="pedal-group">
                    <div class="speed-levels">
                        <button class="t-btn" data-level="0">低</button>
                        <button class="t-btn on" data-level="1">中</button>
                        <button class="t-btn" data-level="2">高</button>

                        <span>c1 <b id="valC1">512</b></span>
                    </div>

                        <div class="gas-fill" id="gasFill" style="height: 0%;"></div>
                        <div class="gas-text"><span class="gas-sub"></span></div>
                    </div>
                </div>
            </div>

    <!-- ========== 编程画线层 ========== -->
    <div class="path-layer" id="pathLayer">
        <div class="path-header">
            <span class="path-title">编程画线</span>
            <span class="path-hint" id="pathHint">按住画线，松手后可执行 · 按目标速度行驶，终点自动收油停车</span>
        </div>
        <canvas class="path-canvas" id="pathCanvas"></canvas>
        <div class="path-footer">
            <button class="t-btn" id="btnPathClear">清除</button>
            <button class="t-btn" id="btnPathLoop">循环</button>
            <button class="t-btn on" id="btnPathExec" disabled="">执行</button>
            <button class="t-btn danger" id="btnPathClose">关闭</button>
        </div>
    </div>

    <!-- ========== 表演模式层 ========== -->
    <div class="path-layer" id="performLayer">
        <div class="path-header">
            <span class="path-title">车辆表演</span>
            <span class="path-hint">点击动作开始连贯表演，可随时紧急停止</span>
        </div>
        <div class="perform-grid">
            <button class="t-btn" data-perform="waltz">华尔兹</button>
            <button class="t-btn" data-perform="snake">贪吃蛇</button>
            <button class="t-btn" data-perform="drift">疾驰漂移</button>
            <button class="t-btn" data-perform="tango">探戈</button>
            <button class="t-btn" data-perform="breathe">呼吸之光</button>
            <button class="t-btn" data-perform="figure8">八字舞</button>
            <button class="t-btn" data-perform="party">狂欢节拍</button>
            <button class="t-btn" data-perform="spin">特技甩尾</button>
        </div>
        <div class="perform-status" id="performStatus" data-dir="none"><span class="st-pause">未开始</span></div>
        <!-- 油门/倒车测试：按住持续下发，松开回中；自动扫描按级读“车从哪一级开始动” -->
        <div class="rev-test show" id="revTest">
            <div class="rev-test-head">
                <button class="btn-mini" id="revTestToggle">油门测试 ▴</button>
                <span class="rev-test-tip" id="revTestReadout">有效区间 前进 720~960 · 后退 300~180 · 按住数值持续下发</span>
            </div>
            <div class="rev-test-body">
                <div class="rev-line">
                    <span class="rev-tag fwd">前进</span>
                    <div class="rev-test-row" id="revFwdRow">
                        <button class="t-btn rev-btn" data-c1="700">700</button>
                        <button class="t-btn rev-btn" data-c1="720">720</button>
                        <button class="t-btn rev-btn" data-c1="740">740</button>
                        <button class="t-btn rev-btn" data-c1="780">780</button>
                        <button class="t-btn rev-btn" data-c1="820">820</button>

        if (State.controlMode === 'gyro') State.controlMode = 'manual'; State.steerTarget = 0; dirty = true;
    }

    function computeInputTargets() {
        if (State.handbrake || performActive) return;
        if (State.pathActive) return;
        if (State.controlMode === 'rc') return;
        const acts = new Set(pointerMap.values());
        if (State.controlMode === 'gyro') {
            if (gyroState === 'active') { const tilt = getTilt(); State.steerTarget = Math.abs(tilt) > GYRO_DEADZONE ? clamp(tilt / GYRO_MAX_TILT, -1, 1) : 0; }
            else { State.steerTarget = 0; }
        } else {
            if (acts.has('left')) State.steerTarget = -1; else if (acts.has('right')) State.steerTarget = 1; else State.steerTarget = 0;
        }
        if (State.gear === 'N') { State.throttleTarget = 0; }
        else if (acts.has('gas')) { State.throttleTarget = THROTTLE_LEVEL_RATIO[State.throttleLevel]; }
        else { State.throttleTarget = 0; }
    }
    function smoothOutputs(dt) {
        if (performActive) return;
        State.throttleOut = State.throttleTarget;
        let sRate = Math.abs(State.steerTarget) > Math.abs(State.steerOut) ? 12 : 18;
        if (State.controlMode === 'gyro') sRate = 15;
        State.steerOut = expSmooth(State.steerOut, State.steerTarget, sRate, dt);
        if (Math.abs(State.steerOut) < 0.005) State.steerOut = 0;
    }
    function computeC1() {
        if (State.gear === 'N') return 512;
        const p = clamp(State.throttleOut, 0, 1);
        if (p <= 0.02) return 512;
        // 拿掉油门死区：一给油就落在有效区间，满油到有效上限
        const k = clamp((p - 0.02) / 0.98, 0, 1);
        if (State.gear === 'D') return Math.round(THR_FWD_MIN + k * (THR_FWD_MAX - THR_FWD_MIN));
        return Math.round(THR_REV_MAX - k * (THR_REV_MAX - THR_REV_MIN));
    }
    function computeSpeedTarget() {
        let c1;
        if (performActive) c1 = performC1;
        else if (State.controlMode === 'rc' && cars[activeCarIp] && cars[activeCarIp].rcOnline) c1 = cars[activeCarIp].rcC1;
        else if (State.pathActive) c1 = pathC1();
        else c1 = computeC1();
        const max = State.driveMode === 0 ? 150 : 40; 
        return Math.abs(c1 - 512) / 512 * max;
    }
    function shouldSendLocally() {
        if (performActive) return false;
        if (State.handbrake) return true; if (State.pathActive) return false;
        if (State.controlMode === 'gyro') return true; if (pointerMap.size > 0) return true;
        if (State.controlMode === 'rc' && cars[activeCarIp] && cars[activeCarIp].rcOnline) return false; return true;
    }
    function sendCommand() {
        if (State.handbrake) { sendPayload(`c1:512,c2:512,c3:${State.lamp},mode:${State.driveMode},hb:1`); lastC1 = 512; return; }
        const c1 = computeC1(); 
        const c2 = Math.round(clamp(512 + State.steerOut * 512, 512 - STEER_MAX, 512 + STEER_MAX));
        sendPayload(`c1:${c1},c2:${c2},c3:${State.lamp},mode:${State.driveMode},hb:0`);
        lastC1 = c1;
    }
    // 锁止状态统一入口（按钮与遥测都用它，避免两处 toggle 逻辑不一致）
    function applyHandbrake(on) {
        State.handbrake = on;
        btnHandbrake.classList.toggle('on', on);
        document.body.classList.toggle('handbrake-on', on);
    }
    function startCoast() {
        const off = Math.abs(lastC1 - 512);
        if (off < 4) { coastActive = false; return; }
        coastActive = true; coastStart = performance.now();
        coastFromOffset = off; coastDir = lastC1 >= 512 ? 1 : -1;
    }
    function coastSend(now) {
        if (!coastActive || performActive) return false;
        if (now - lastSendTime < SEND_INTERVAL) return true;
        const k = clamp((now - coastStart) / PATH_COAST_MS, 0, 1);
        let off = Math.round(coastFromOffset * (1 - k));
        // 滑行衰减到死区边界就直接回中，不在死区里停留
        const dead = coastDir > 0 ? (THR_FWD_MIN - 512) : (512 - THR_REV_MAX);
        if (off < dead) off = 0;
        const c1 = coastDir > 0 ? 512 + off : 512 - off;
        sendPayload(`c1:${c1},c2:512,c3:${State.lamp},mode:${State.driveMode},hb:0`);
        lastC1 = c1; lastSendTime = now;
        if (k >= 1) { coastActive = false; }
        return true;
    }
    // 按压看门狗：
    // a) 正常按住时指针捕获仍然有效 → 不动；捕获丢失说明系统已经松手/事件丢了 → 立即回中；
    // b) 设备不支持捕获时退回"超时无事件"兜底（RELEASE_WATCHDOG_MS），防止永远按住。
    function holdWatchdog(now) {
        if (!pointerMap.size) return;
        let lost = false;
        pointerMap.forEach((act, id) => {
            if (!capturedIds.has(id)) return;
            const el = act === 'gas' ? pedalGas : (act === 'left' ? btnLeft : btnRight);
            let cap = false;
            try { cap = el.hasPointerCapture(id); } catch (err) { cap = false; }
            if (!cap) lost = true;
        });
        if (lost) { forceNeutral('capture-lost'); return; }
        if (!capturedIds.size && now - lastPointerEvt > RELEASE_WATCHDOG_MS) forceNeutral('no-events');
    }
    // 空闲看门狗：没有按压/表演/路径，却不是中位 → 强制回 512（手指松开后车不许停在某个油门上）
    function idleGuard(now) {
        if (pointerMap.size || performActive || State.pathActive || coastActive || State.handbrake) return;
        if (revHoldActive || revAutoRun) return;   // 测试面板按住/自动扫描期间由面板持续下发，不算"空闲"
        if (State.controlMode === 'gyro' || State.controlMode === 'rc') return;
        if (now - lastForceNeutral < IDLE_GUARD_MS) return;
        if (Math.abs(lastSentC1 - 512) > 2) forceNeutral('idle-guard');
    }
    function maybeSend(now) {
        if (performActive) {
            if (now - lastSendTime < SEND_INTERVAL) return;
            sendPayload(`c1:${performC1},c2:${performC2},c3:${performLamp},mode:${State.driveMode},hb:0`);
            lastSendTime = now;
            return;
        }
        if (State.handbrake) coastActive = false;
        if (pathOverrideSend(now)) return;
        if (coastSend(now)) return;
        holdWatchdog(now);
        idleGuard(now);
        if (now - lastSendTime < SEND_INTERVAL) return;
        if (!shouldSendLocally()) { lastSendTime = now; return; }
        const active = pointerMap.size > 0 || Math.abs(State.throttleOut) > 0.001 || Math.abs(State.steerOut) > 0.001 || State.handbrake || State.controlMode === 'gyro' || dirty;
        if (!active) {
            // 倒车退出：松手/换挡/锁止后没有输入，也要继续推 512 把闸门斜坡走完，
            // 只发一帧的话车会停在倒车中间值（例如 230）不再回中。
            // 测试面板按住/自动扫描期间由面板自己持续下发目标值，不能在这里抢发 512。
            if (revPhase !== 'idle' && !revHoldActive && !revAutoRun) { pushNeutral(); lastSendTime = now; }
            return;
        }
        sendCommand(); lastSendTime = now; dirty = false;
    }
    
    function updateSteerUI(ratio) {
        const pct = 50 + ratio * 45;
        steerBall.style.left = pct + '%';
        if (ratio > 0.1) {
            steerBall.style.background = 'radial-gradient(circle, #fff, #ff1744)';
            steerBall.style.boxShadow = '0 0 15px #ff1744, 0 0 5px #fff';
        } else if (ratio < -0.1) {
            steerBall.style.background = 'radial-gradient(circle, #fff, #4ade80)';
            steerBall.style.boxShadow = '0 0 15px #4ade80, 0 0 5px #fff';
        } else {
            steerBall.style.background = 'radial-gradient(circle, #fff, #00e5ff)';
            steerBall.style.boxShadow = '0 0 15px #00e5ff, 0 0 5px #fff';
        }
    }

    function renderGauge() {
        const shown = Math.round(State.displaySpeed);
        if (shown !== lastShown) { valSpeed.innerText = shown; lastShown = shown; valSpeed.style.color = shown > 120 ? 'var(--danger)' : 'var(--text-main)'; }
        const ratio = clamp(State.displaySpeed / 150, 0, 1);
        needleGroup.setAttribute('transform', `rotate(${-135 + ratio * 270} 100 100)`);
        speedArc.setAttribute('stroke-dasharray', `${(ratio * ARC_FULL).toFixed(1)} ${ARC_FULL.toFixed(1)}`);
        const overload = State.displaySpeed > 120;
        if (overload !== overloadActive) { overloadActive = overload; gaugeWrapper.classList.toggle('overload', overload); }
    }

    // =============== 图表绘制与遥测 ===============
    function drawTelemetry() {
        const ctx = telemetryCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = telemetryCanvas.getBoundingClientRect();
        if (telemetryCanvas.width !== Math.round(rect.width * dpr)) {
            telemetryCanvas.width = rect.width * dpr;
            telemetryCanvas.height = rect.height * dpr;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1; ctx.beginPath();
        for(let i=1; i<5; i++) {
            ctx.moveTo(0, h * i / 5); ctx.lineTo(w, h * i / 5);
            ctx.moveTo(w * i / 5, 0); ctx.lineTo(w * i / 5, h);
        }
        ctx.stroke();

        if (telemetryData.length < 2) return;

        const getX = (index) => (index / (MAX_TELEMETRY_POINTS - 1)) * w;
        const getY_Angle = (val) => h/2 - (val / 90) * (h/2); 
        const getY_Speed = (val) => h - (val / 150) * h;       

        function drawLine(dataKey, color, yMapper) {
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
            for (let i = 0; i < telemetryData.length; i++) {
                const x = getX(i); const y = yMapper(telemetryData[i][dataKey]);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        drawLine('pitch', '#ffeb3b', getY_Angle);
        drawLine('roll', '#00e5ff', getY_Angle);
        drawLine('speed', '#4ade80', getY_Speed);
    }

    function recordTelemetry(now) {
        if (now - lastTelemetryTime < 100) return;
        lastTelemetryTime = now;
        const car = cars[activeCarIp];
        if (!car) return;
        telemetryData.push({
            time: new Date().toLocaleTimeString(),
            pitch: car.pitch || 0, roll: car.roll || 0, speed: State.displaySpeed
        });
        if (telemetryData.length > MAX_TELEMETRY_POINTS) telemetryData.shift();
        if (telemetryPanel.classList.contains('show')) drawTelemetry();
    }

    function exportCSV() {
        if (telemetryData.length === 0) return alert("无数据！");
        let csv = "data:text/csv;charset=utf-8,\uFEFFTime,Pitch,Roll,Speed\n";
        telemetryData.forEach(row => { csv += `${row.time},${row.pitch.toFixed(2)},${row.roll.toFixed(2)},${row.speed.toFixed(2)}\n`; });
        const encodedUri = encodeURI(csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `telemetry_${activeCarIp}_${new Date().getTime()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    // =============== 主循环 ===============
    function mainLoop(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000); lastFrameTime = now;
        
        updatePerform(dt); 
        computeInputTargets(); smoothOutputs(dt);
        State.speedTarget = computeSpeedTarget();
        State.displaySpeed = expSmooth(State.displaySpeed, State.speedTarget, 10, dt);
        if (Math.abs(State.displaySpeed - State.speedTarget) < 0.1) State.displaySpeed = State.speedTarget;
        updatePathMotion(dt); renderPathFrame();
        
        let displaySteer = 0;
        if (!State.handbrake) {
            if (performActive) displaySteer = clamp((performC2 - 512) / 512, -1, 1);
            else if (State.pathActive) displaySteer = clamp(trip.steer / STEER_MAX, -1, 1);
            else displaySteer = clamp(State.steerOut, -1, 1);
        }
        updateSteerUI(displaySteer);

        recordTelemetry(now);
        maybeSend(now); renderGauge(); renderThrottleUI(); requestAnimationFrame(mainLoop);
    }

    // =============== 表演控制逻辑 ===============
    function playPerform(type, btnElement) {
        if (revTestBusy()) return;   // 倒车测试期间禁用表演，避免两路指令互相覆盖
        stopNeutralPush();
        // 车辆遥测上报的锁止（不是用户主动锁止）不应挡住表演：表演指令本身就下发 hb:0
        if (State.handbrake) { if (handbrakeLocal) return; applyHandbrake(false); }
        if (State.pathActive) cancelPath();
        if (gyroState !== 'off') exitGyro();
        if (activePerformBtn) activePerformBtn.classList.remove('active-perform');
        activePerformBtn = btnElement;
        if (activePerformBtn) activePerformBtn.classList.add('active-perform');
        performActive = true; performType = type; performStartTime = performance.now();
        State.controlMode = 'perform'; lastPerformLamp = -1;
    }
    function stopPerform() {
        if (!performActive) return;
        performActive = false; performType = '';
        if (activePerformBtn) { activePerformBtn.classList.remove('active-perform'); activePerformBtn = null; }
        if (State.controlMode === 'perform') State.controlMode = 'manual';
        performC1 = Math.round(performC1 + (512 - performC1) * 0.5);
        performC2 = Math.round(performC2 + (512 - performC2) * 0.5);
        sendPayload(`c1:${performC1},c2:${performC2},c3:${State.lamp},mode:${State.driveMode},hb:0`);
        performC1 = 512; performC2 = 512;
        sendNeutralRamp();   // 连续推送 512，直到倒车斜坡与退出保持走完
        performSegName = ''; lastPerformStatusKey = '';
        if (performStatusEl) { performStatusEl.dataset.dir = 'none'; performStatusEl.innerHTML = '<span class="st-pause">未开始</span>'; }
    }
    // 表演状态条：纯 UI 显示（段名 / 方向 / 实时 c1、c2），不参与任何控制逻辑
    function performDirection(c1, c2) {
        const d1 = c1 - 512, d2 = c2 - 512;
        if (Math.abs(d1) <= 8) return Math.abs(d2) <= 14 ? 'pause' : 'turn';
        return d1 < 0 ? 'rev' : 'fwd';
    }
    function renderPerformStatus() {
        if (!performStatusEl) return;
        const shownC1 = Math.round(lastSentC1);   // 显示实际下发值（含倒车武装/斜坡阶段）
        const dir = performDirection(shownC1, performC2);
        const label = { rev: '后退', fwd: '前进', turn: '原地转', pause: '停顿' }[dir];
        const cls = { rev: 'st-rev', fwd: 'st-fwd', turn: 'st-turn', pause: 'st-pause' }[dir];
        const ready = isSendReady();
        const key = performSegName + '|' + shownC1 + '|' + performC2 + '|' + (ready ? 1 : 0);
        if (key === lastPerformStatusKey) return;
        lastPerformStatusKey = key;
        performStatusEl.dataset.dir = dir;
        performStatusEl.innerHTML = '<b>' + (performSegName || '—') + '</b> · <span class="' + cls + '">' + label + '</span>' +
            ' · c1 <b>' + shownC1 + '</b> c2 <b>' + performC2 + '</b>' +
            (ready ? '' : ' · <span class="st-warn">未连接车辆·指令未下发</span>');
    }
    function updatePerform(dt) {
        if (!performActive) return;
        const t = (performance.now() - performStartTime) / 1000;
        let finish = false;
        const dance = PERFORM_DANCES[performType];
        let c1t = 512, c2t = 512;
        if (!dance || t >= PERFORM_MAX_T) finish = true;
        if (dance) {
            // 循环舞按整段表取模，单次舞跑到总长即结束
            const segs = dance.segs;
            let total = 0;
            for (let i = 0; i < segs.length; i++) total += segs[i].d;
            let x = t;
            if (dance.once) { if (x >= total) { x = total; finish = true; } }
            else if (total > 0) { x = x % total; }
            let acc = 0, seg = segs[segs.length - 1], local = 1;
            for (let i = 0; i < segs.length; i++) {
                const s = segs[i];
                if (x < acc + s.d) { seg = s; local = (x - acc) / s.d; break; }
                acc += s.d;
            }
            const k = perfEase(seg.ease, local);
            c1t = mapPerfC1(seg.c1a + (seg.c1b - seg.c1a) * k);   // 编排幅度映射到油门有效区间
            c2t = seg.c2a + (seg.c2b - seg.c2a) * k;
            if (seg.lamp >= 0) performLamp = seg.lamp;
            performSegName = seg.n || '';
        }
        // 斜坡限速 + 协议区间钳制：段间不急停急起，也不越界
        const dC1 = PERFORM_C1_SLEW * dt, dC2 = PERFORM_C2_SLEW * dt;
        performC1 = Math.round(clamp(performC1 + clamp(c1t - performC1, -dC1, dC1), PERFORM_C1_MIN, PERFORM_C1_MAX));
        performC2 = Math.round(clamp(performC2 + clamp(c2t - performC2, -dC2, dC2), PERFORM_C2_MIN, PERFORM_C2_MAX));
        if (performLamp !== lastPerformLamp) {
            lastPerformLamp = performLamp;
            btnLamp.innerText = performLamp ? '耀光关' : '耀光开';
            btnLamp.classList.toggle('on', performLamp === 1);
        }
        renderPerformStatus();
        if (finish) stopPerform();
    }

    // =============== WS 初始化与多车管理 ===============
    function initWS(ip) {
        const car = cars[ip];
        if (!car) return;
        if (car.ws && (car.ws.readyState === 0 || car.ws.readyState === 1)) return;
        try { car.ws = new WebSocket(`ws://${ip}:81/`); } catch (e) { setTimeout(() => initWS(ip), car.reconnectDelay); car.reconnectDelay = Math.min(WS_RECON_MAX, car.reconnectDelay * 1.5); return; }
        
        car.ws.onopen = () => { 
            car.connected = true; car.gotFirstMsg = false; car.lastWsMsgTime = Date.now(); car.reconnectDelay = WS_RECON_MIN; 
            if (ip === activeCarIp) { wsDot.className = 'status-dot ws-connected'; wsText.innerText = '在线'; }
            dirty = true; 
        };
        car.ws.onclose = () => { 
            car.connected = false; 
            if (ip === activeCarIp) { wsDot.className = 'status-dot error'; wsText.innerText = '断连'; enterFailSafe(); }
            setTimeout(() => initWS(ip), car.reconnectDelay); car.reconnectDelay = Math.min(WS_RECON_MAX, car.reconnectDelay * 1.5); 
        };
        car.ws.onerror = () => {};
        car.ws.onmessage = (event) => {
            car.lastWsMsgTime = Date.now(); car.gotFirstMsg = true;
            const data = event.data.split(','); if (data.length < 8) return;
            const p = parseFloat(data[0]); const r = parseFloat(data[1]); const sig = data[3]; const c1 = parseInt(data[5]); const srvMode = parseInt(data[6]); const srvHb = parseInt(data[7]);
            
            car.pitch = p; car.roll = r; 
            
            if (ip === activeCarIp) {
                if (!isNaN(p) && !isNaN(r)) {
                    valPitch.innerText = p.toFixed(1); valRoll.innerText = r.toFixed(1);
                    attitudeHorizon.style.transform = `rotateX(${p}deg) rotateZ(${-r}deg)`;
                }
                if (sig === '1') {
                    car.lastRcTime = Date.now();
                    if (!car.rcOnline) { car.rcOnline = true; rcDot.className = 'status-dot ws-connected'; rcText.innerText = '遥测在线'; }
                    if (!isNaN(c1)) car.rcC1 = c1;
                }
                if (!isNaN(srvMode) && srvMode !== State.driveMode) applyModeUI(srvMode);
                if (!isNaN(srvHb)) {
                    const hb = srvHb === 1;
                    // 画线/表演进行中本页面持续下发 hb:0，车辆侧可能回传一条滞后 hb=1，不能让它把刚启动的动作立刻打断
                    if (!(hb && (performActive || State.pathActive)) && hb !== State.handbrake) {
                        applyHandbrake(hb); handbrakeLocal = false;
                        if (hb) { clearAllPointers(); if (gyroState !== 'off') exitGyro(); if (State.pathActive) cancelPath(true); if (performActive) stopPerform(); }
                    }
                }
            } else {
                if (sig === '1') car.lastRcTime = Date.now();
            }
        };
    }

    function enterFailSafe() {
        if (failsafeActive) return; failsafeActive = true; document.body.classList.add('failsafe');
        if (State.pathActive) cancelPath(true); clearAllPointers(); if (gyroState !== 'off') exitGyro(); if (performActive) stopPerform();
        State.controlMode = 'manual'; State.steerTarget = 0; State.throttleTarget = 0; State.steerOut = 0; State.throttleOut = 0;
    }
    function exitFailSafe() { if (!failsafeActive) return; failsafeActive = false; document.body.classList.remove('failsafe'); }

    setInterval(() => {
        const car = cars[activeCarIp];
        if (!car) return;
        if (car.gotFirstMsg && car.connected && Date.now() - car.lastWsMsgTime > WATCHDOG_MS) enterFailSafe();
        if (car.rcOnline && Date.now() - car.lastRcTime > RC_TIMEOUT_MS) { car.rcOnline = false; rcDot.className = 'status-dot error'; rcText.innerText = '遥测断开'; if (State.controlMode === 'rc') State.controlMode = 'manual'; }
        if (car.rcOnline && State.controlMode === 'manual' && pointerMap.size === 0 && !State.pathActive && !performActive) State.controlMode = 'rc';
    }, 500);

    function applyModeUI(mode) {
        if (mode !== 0 && mode !== 2) return; State.driveMode = mode;
        Object.keys(modeBtns).forEach(k => modeBtns[k].classList.toggle('on', parseInt(k) === mode)); dirty = true;
    }
    Object.keys(modeBtns).forEach(k => { modeBtns[k].addEventListener('click', () => { applyModeUI(parseInt(k)); dirty = true; }); });

    // =============== 车辆管理 UI 逻辑 ===============
    function renderCarSelect() {
        carSelect.innerHTML = '';
        carList.forEach(ip => {
            const opt = document.createElement('option');
            opt.value = ip; opt.textContent = ip;
            if (ip === activeCarIp) opt.selected = true;

        });
    }
    renderCarSelect();

    btnManageCars.addEventListener('click', () => {
        manageList.innerHTML = '';
        carList.forEach((ip, idx) => {
            const div = document.createElement('div');
            div.className = 'manage-item';
            div.innerHTML = `<input type="text" value="${ip}" data-idx="${idx}"><button class="btn-del" data-idx="${idx}">✕</button>`;
            manageList.appendChild(div);
        });
        managePanel.classList.add('show');
    });

    btnAddCar.addEventListener('click', () => {

        if (pathHint) pathHint.textContent = immediate ? '已停止 · 立即收油' : '已中止 · 收油滑行中';
        if (immediate) { coastActive = false; sendPayload(`c1:512,c2:512,c3:${State.lamp},mode:${State.driveMode},hb:${State.handbrake ? 1 : 0}`); lastC1 = 512; }
        else { startCoast(); } pathNeedsRender = true;
    }
    function showPathProgress(pct) {
        let el = document.getElementById('pathProgress');
        if (!el) { el = document.createElement('div'); el.id = 'pathProgress'; el.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:2600;padding:6px 16px;border-radius:20px;background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.5);color:#00e5ff;font-size:12px;font-weight:bold;font-family:monospace;letter-spacing:1px;text-shadow:0 0 10px rgba(0,229,255,0.8);box-shadow:0 0 20px rgba(0,229,255,0.25);pointer-events:none;white-space:nowrap;'; document.body.appendChild(el); }
        el.textContent = `画线执行中 ${pct}%`; el.style.display = 'block';
    }
    function hidePathProgress() { const el = document.getElementById('pathProgress'); if (el) el.style.display = 'none'; }
    function pathOverrideSend(now) {
        if (!State.pathActive) return false; coastActive = false; if (now - lastSendTime < SEND_INTERVAL) return true;
        const c1 = pathC1(); const c2 = Math.round(clamp(512 + trip.steer, 512 - STEER_MAX, 512 + STEER_MAX));
        sendPayload(`c1:${c1},c2:${c2},c3:${State.lamp},mode:${State.driveMode},hb:0`); lastC1 = c1; lastSendTime = now; return true;
    }
    function openPathLayer() {
        if (performActive) stopPerform();
        performLayer.classList.remove('show'); btnPerform.classList.remove('on');
        pathLayer.classList.add('show'); btnPath.classList.add('on');
        setTimeout(() => { initPathCanvas(); if (!pathData) clearPathCanvas(); else { btnPathExec.disabled = !hasLine; renderPathFrame(); } }, 50);
    }
    function closePathLayer() {
        if (isDrawing) { isDrawing = false; activePointerId = -1; rawPts = []; } if (State.pathActive) cancelPath(); pathLayer.classList.remove('show'); btnPath.classList.remove('on');
    }
    btnPath.addEventListener('click', () => { if (pathLayer.classList.contains('show')) closePathLayer(); else openPathLayer(); });
    btnPathClose.addEventListener('click', closePathLayer);
    btnPathClear.addEventListener('click', () => { clearPathCanvas(); });
    btnPathExec.addEventListener('click', () => { if (hasLine && pathData) startPathExecution(); });
    btnPathLoop.addEventListener('click', () => { loopMode = !loopMode; btnPathLoop.classList.toggle('on', loopMode); btnPathLoop.innerText = loopMode ? '循环中' : '循环'; if (pathHint) pathHint.textContent = loopMode ? '循环模式：到终点后自动从头再跑' : '单次模式：到终点后停住'; });
    window.addEventListener('resize', () => { if (pathLayer.classList.contains('show')) initPathCanvas(); });

    btnPerform.addEventListener('click', () => {
        if (performLayer.classList.contains('show')) {
            performLayer.classList.remove('show'); btnPerform.classList.remove('on');
            stopPerform();
        } else {
            if (pathLayer.classList.contains('show')) closePathLayer();
            performLayer.classList.add('show'); btnPerform.classList.add('on');
        }
    });
    btnPerformClose.addEventListener('click', () => {
        stopPerform();
        performLayer.classList.remove('show'); btnPerform.classList.remove('on');
    });
    btnPerformStop.addEventListener('click', stopPerform);
    document.querySelectorAll('.perform-grid .t-btn').forEach(btn => {
        btn.addEventListener('click', (e) => playPerform(btn.dataset.perform, e.currentTarget));
    });

    // ================= 油门/倒车测试面板（现场标定，仍走统一倒车时序） =================
    const revTestEl = document.getElementById('revTest');
    const revTestReadoutEl = document.getElementById('revTestReadout');
    const revTestToggleEl = document.getElementById('revTestToggle');
    const calFwdEl = document.getElementById('calFwd');
    const calRevEl = document.getElementById('calRev');
    let revHoldActive = false, revAutoRun = false, revHoldTimer = null, revHoldTarget = null, revHoldBtn = null;
    let revScanStep = 0, revScanTotal = 0, revScanStart = 0;
    function revTestBusy() { return revHoldActive || revAutoRun; }
    function revPhaseName() { return ({ arm: '回中保持', down: '斜坡下降', up: '斜坡回中', hold: '退出保持', idle: '待机' })[revPhase] || revPhase; }
    function revReadout() {
        const conn = isSendReady() ? '' : ' · 未连接';
        if (revAutoRun) {
            const el = Math.max(0, (performance.now() - revScanStart) / 1000);
            revTestReadoutEl.textContent = `自动扫描 ${revScanStep}/${revScanTotal} · 目标 ${revHoldTarget} · 实发 ${lastSentC1} · 已 ${el.toFixed(1)}s${conn}`;
        } else if (revHoldActive) revTestReadoutEl.textContent = `按住 · 目标 ${revHoldTarget} · 实发 ${lastSentC1} · ${revPhaseName()}${conn}`;
        else revTestReadoutEl.textContent = `有效区间 前进 ${THR_FWD_MIN}~${THR_FWD_MAX} · 后退 ${THR_REV_MAX}~${THR_REV_MIN} · 按住数值持续下发`;
    }
    function revSend(target) { sendPayload(`c1:${target},c2:512,c3:${State.lamp},mode:${State.driveMode},hb:0`); }
    function revBtnLabel(btn, actual) {
        if (!btn) return;
        btn.innerHTML = actual === null ? btn.dataset.c1 : `${btn.dataset.c1}<small>实发 ${actual}</small>`;
    }
    // 标定值写入运行参数（可随时改，下一帧编排/手动/路径立即生效）
    function applyCalibValues(fwd, rev, silent) {
        fwd = clamp(Math.round(fwd), 560, 1023);
        rev = clamp(Math.round(rev), 150, 500);
        if (fwd >= THR_FWD_MAX) fwd = THR_FWD_MAX - 10;
        if (rev <= THR_REV_MIN) rev = THR_REV_MIN + 10;
        THR_FWD_MIN = fwd; THR_REV_MAX = rev;
        if (calFwdEl) calFwdEl.value = fwd;
        if (calRevEl) calRevEl.value = rev;
        try { localStorage.setItem(CAL_KEY, JSON.stringify({ fwdMin: fwd, revMax: rev })); } catch (e) {}
        if (!silent) revTestReadoutEl.textContent = `标定已应用：前进 ≥${fwd}，后退 ≤${rev}（表演/手动/路径已生效）`;
    }
    (function loadCalib() {
        try {
            const o = JSON.parse(localStorage.getItem(CAL_KEY) || 'null');
            if (o && isFinite(o.fwdMin) && isFinite(o.revMax)) applyCalibValues(o.fwdMin, o.revMax, true);
        } catch (e) {}
    })();
    function revHoldStart(target, btn) {
        if (revAutoRun) return;
        if (revHoldActive) revHoldEnd();
        if (performActive) stopPerform();
        if (State.pathActive) cancelPath();
        if (gyroState !== 'off') exitGyro();
        if (State.handbrake) applyHandbrake(false);
        stopNeutralPush();
        revHoldActive = true; revHoldTarget = target; revHoldBtn = btn;
        if (btn) btn.classList.add('holding');
        revSend(target);
        revHoldTimer = setInterval(() => {
            if (!revHoldActive) return;
            revSend(target);
            revBtnLabel(btn, lastSentC1);
            revReadout();
        }, 20);
        revBtnLabel(btn, lastSentC1); revReadout();
    }
    function revHoldEnd() {
        if (!revHoldActive && !revHoldBtn) return;
        revHoldActive = false;
        if (revHoldTimer) { clearInterval(revHoldTimer); revHoldTimer = null; }
        if (revHoldBtn) { revHoldBtn.classList.remove('holding'); revBtnLabel(revHoldBtn, null); revHoldBtn = null; }
        revHoldTarget = null;
        sendNeutralRamp();   // 松开后连续推送 512，走完回中斜坡与退出保持
        revReadout();
    }
    revTestEl.querySelectorAll('.rev-btn[data-c1]').forEach(btn => {
        const target = Number(btn.dataset.c1);
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); revHoldStart(target, btn); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, () => revHoldEnd()));
    });
    revTestToggleEl.addEventListener('click', () => {
        revTestEl.classList.toggle('show');
        revTestToggleEl.innerText = revTestEl.classList.contains('show') ? '油门测试 ▴' : '油门测试 ▾';
    });
    document.getElementById('calApply').addEventListener('click', () => {
        applyCalibValues(Number(calFwdEl.value), Number(calRevEl.value), false);
        revReadout();
    });
    document.getElementById('revTestAuto').addEventListener('click', () => {
        if (revTestBusy()) return;
        if (performActive) stopPerform();
        if (State.pathActive) cancelPath();
        if (State.handbrake) applyHandbrake(false);
        stopNeutralPush();
        revAutoRun = true;
        // 前进 700→990 递增，后退 300→160 递减，每级 1.2s（边界值用于现场复核起转点）
        const steps = [700, 720, 740, 780, 820, 860, 900, 950, 990,
                       300, 280, 260, 240, 220, 200, 180, 160];
        revScanTotal = steps.length; revScanStep = 0; revScanStart = performance.now();
        const log = [];
        let i = 0;
        (function next() {
            if (!revAutoRun) return;
            if (i >= steps.length) {
                revAutoRun = false; revHoldTarget = null;
                sendNeutralRamp(); revReadout();   // 扫描结束走完整回中序列
                revTestReadoutEl.textContent = '自动扫描完成：' + log.join(' / ');
                return;
            }
            const v = steps[i++]; revScanStep = i;
            revHoldTarget = v; revReadout();
            const until = performance.now() + 1200;
            (function tick() {
                if (!revAutoRun) return;
                revSend(v); revReadout();
                if (performance.now() < until) setTimeout(tick, 20);
                else { log.push(v + '→' + lastSentC1); next(); }
            })();
        })();
    });
    revReadout();

    // 启动
    setTimeout(() => updateGearUI(1), 100);
    applyModeUI(0);
    if (activeCarIp) initWS(activeCarIp);
    requestAnimationFrame(mainLoop);
    </script>
